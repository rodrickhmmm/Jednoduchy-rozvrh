[project]
name = "Jednoduchý rozvrh"
version = "1.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rodri_", email = "rodriunderscore@gmail.com" }
]
dependencies = [
    "flet>=0.86.5",
    "Requests==2.34.2"
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.mycompany"
product = "Jednoduchý rozvrh"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"
